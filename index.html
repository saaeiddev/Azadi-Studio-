<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Azadi Studio</title>
  <meta name="description" content="Azadi Studio — Coming Soon" />
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100%, 1100px);
      text-align: center;
    }

    .hello {
      margin: 0;
      color: #ff2d2d;
      font-size: clamp(96px, 18vw, 260px);
      line-height: 0.86;
      letter-spacing: -0.07em;
      font-weight: 700;
      direction: ltr;
    }

    .message {
      margin: 56px auto 0;
      max-width: 760px;
      color: #111111;
      font-size: clamp(22px, 3vw, 38px);
      line-height: 1.7;
      font-weight: 600;
    }

    .name {
      margin-top: 18px;
      color: #6e6e73;
      font-size: clamp(16px, 1.6vw, 22px);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="hello">hello.</h1>
    <p class="message">سایت در حال ساخته شدنه، به‌زودی...</p>
    <p class="name">امیر سعید دهقان</p>
  </main>
</body>
</html>
