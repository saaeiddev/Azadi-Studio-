name: Adaptive device experience patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adaptive-device-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add adaptive iPhone / workstation experience
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_marker = '/* ADAPTIVE DEVICE EXPERIENCE */'
          css = r'''
          /* ADAPTIVE DEVICE EXPERIENCE */
          body.device-mobile .desk-zone{height:58%;bottom:-2%}
          body.device-mobile .pc,
          body.device-mobile .speaker,
          body.device-mobile .figure,
          body.device-mobile .funko,
          body.device-mobile .keyboard,
          body.device-mobile .mouse{display:none!important}
          body.device-mobile .desk-top{top:42%;height:32%;opacity:.72}
          body.device-mobile .desk-edge{top:69%;height:11%}
          body.device-mobile .computer{
            width:min(72vw,310px)!important;
            aspect-ratio:9/19.5!important;
            bottom:2%!important;
            animation:phoneFloat 5.8s ease-in-out infinite!important;
            filter:drop-shadow(0 34px 48px rgba(0,0,0,.72)) drop-shadow(0 0 32px rgba(240,24,47,.08));
            transform:translate3d(calc(-50% + var(--mx)*4px),calc(var(--my)*3px),0) perspective(1050px) rotateX(calc(var(--my)*-1.2deg)) rotateY(calc(var(--mx)*2.5deg));
          }
          body.device-mobile .computer:hover{
            transform:translate3d(calc(-50% + var(--mx)*3px),calc(var(--my)*2px - 4px),0) perspective(1050px) rotateX(calc(var(--my)*-.8deg)) rotateY(calc(var(--mx)*2deg));
          }
          body.device-mobile .computer:before,
          body.device-mobile .computer:after{content:"";position:absolute;z-index:9;left:-4px;width:4px;border-radius:4px 0 0 4px;background:linear-gradient(180deg,#67676d,#151519 70%,#050506);box-shadow:-2px 0 5px rgba(0,0,0,.35)}
          body.device-mobile .computer:before{top:22%;height:9%}
          body.device-mobile .computer:after{top:34%;height:15%}
          body.device-mobile .monitor{
            left:0;right:0;top:0;height:100%;
            padding:8px;
            border-radius:48px;
            background:linear-gradient(118deg,#5c5c63 0,#111116 9%,#050507 45%,#1c1c21 91%,#77777d 100%);
            border:1px solid rgba(255,255,255,.34);
            box-shadow:inset 0 1px 1px rgba(255,255,255,.48),inset 0 -2px 10px #000,0 0 0 1px rgba(0,0,0,.75),0 24px 55px rgba(0,0,0,.5);
            transform:translateZ(30px);
          }
          body.device-mobile .monitor:before{
            content:"";position:absolute;z-index:40;left:50%;top:15px;transform:translateX(-50%);
            width:31%;height:21px;border-radius:16px;background:#020203;
            box-shadow:inset 0 -1px 2px rgba(255,255,255,.04),0 1px 4px rgba(0,0,0,.85);
          }
          body.device-mobile .monitor:after{
            content:"";position:absolute;z-index:41;left:61%;top:22px;width:4px;height:4px;border-radius:50%;
            background:#111a24;box-shadow:0 0 4px rgba(90,150,255,.32);
          }
          body.device-mobile .screen{
            border-radius:40px;
            background:radial-gradient(circle at 72% 18%,rgba(240,24,47,.22),transparent 27%),linear-gradient(155deg,#17171f,#08080d 60%,#111118);
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 0 48px rgba(0,0,0,.38);
          }
          body.device-mobile .monitor-neck,
          body.device-mobile .monitor-base{display:none!important}
          body.device-mobile .desktop-top{height:48px;padding:16px 13px 0;background:linear-gradient(180deg,rgba(5,5,8,.58),rgba(5,5,8,.12));border-bottom:0}
          body.device-mobile .desktop-brand{font-size:7px;letter-spacing:.11em}
          body.device-mobile .desktop-dot{width:8px;height:8px;border-radius:3px}
          body.device-mobile .desktop-status{gap:5px;font-size:6px}
          body.device-mobile .desktop-status span:last-child{display:none}
          body.device-mobile .desktop-icons{
            left:7%;right:7%;top:12%;bottom:12%;
            grid-template-columns:repeat(3,1fr);
            grid-template-rows:repeat(4,1fr);
            gap:8px 5px;
          }
          body.device-mobile .desk-icon{gap:5px;justify-content:center}
          body.device-mobile .icon3d{width:clamp(40px,12vw,48px)!important;border-radius:15px!important;transform:perspective(150px) rotateX(7deg) rotateY(-8deg)}
          body.device-mobile .icon3d:before{inset:4px;border-radius:12px!important}
          body.device-mobile .desk-icon span{font-size:6px!important;max-width:68px!important}
          body.device-mobile .taskbar{bottom:11px;height:42px;padding:5px 7px;border-radius:16px;background:rgba(28,28,35,.58);backdrop-filter:blur(22px) saturate(155%)}
          body.device-mobile .task-icon{width:31px;height:31px;border-radius:10px}
          body.device-mobile .service-window{left:5%;right:5%;top:7%;bottom:8%;border-radius:27px}
          body.device-mobile .win-head{height:42px;padding:8px 11px 0}
          body.device-mobile .win-body{height:calc(100% - 42px);grid-template-columns:1fr}
          body.device-mobile .win-visual{display:none}
          body.device-mobile .win-copy{padding:12% 10%;justify-content:center}
          body.device-mobile .win-copy h3{font-size:28px;line-height:.95;margin:8px 0 10px}
          body.device-mobile .win-copy p{font-size:10px;line-height:1.6}
          body.device-mobile .win-tags{gap:6px;margin-top:14px}
          body.device-mobile .win-tags span{font-size:7px;padding:6px 8px}
          body.device-mobile .monitor-cta{bottom:0;transform:translate(-50%,125%);white-space:nowrap}
          body.device-mobile.focus-mode .room{transform:translate3d(0,1vh,0) scale(1.02)}
          body.device-mobile.focus-mode .computer{
            width:min(78vw,335px)!important;
            bottom:2%!important;
            transform:translate3d(-50%,0,0) perspective(1050px) rotateX(0) rotateY(0)!important;
            animation:none!important;
          }
          body.device-mobile.focus-mode .desk-top{opacity:.24}
          body.device-mobile .focus-exit{right:14px;top:82px}
          body.device-mobile .hero-copy{top:84px}
          body.device-mobile .hero-copy h1{font-size:36px}
          body.device-mobile .hero-copy p{font-size:11px}
          body.device-mobile .hero-copy .actions{margin-top:14px}
          body.device-mobile .scroll-hint{display:none}
          @keyframes phoneFloat{0%,100%{margin-bottom:0;rotate:0deg}50%{margin-bottom:8px;rotate:.35deg}}
          @media(max-height:760px) and (max-width:720px){
            body.device-mobile .hero-copy p{display:none}
            body.device-mobile .hero-copy h1{font-size:31px}
            body.device-mobile .computer{width:min(61vw,265px)!important}
          }
          '''

          if css_marker not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          js_marker = '// ADAPTIVE DEVICE DETECTION'
          js = r'''
          // ADAPTIVE DEVICE DETECTION
          (function(){
            const mobileUA=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent||'');
            const coarse=()=>window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
            const narrow=()=>window.matchMedia&&window.matchMedia('(max-width:820px)').matches;
            let resizeTimer;
            function applyDeviceExperience(){
              const isMobile=mobileUA||(coarse()&&narrow())||window.innerWidth<720;
              document.body.classList.toggle('device-mobile',isMobile);
              document.body.classList.toggle('device-desktop',!isMobile);
              const focusNav=document.getElementById('focusNav');
              const monitorCta=document.getElementById('monitorCta');
              const computer=document.getElementById('computer');
              if(focusNav) focusNav.textContent=isMobile?'3D iPhone':'3D Desktop';
              if(monitorCta) monitorCta.textContent=isMobile?'Tap to focus the 3D iPhone':'Click to focus the 3D computer';
              if(computer) computer.setAttribute('aria-label',isMobile?'Interactive 3D iPhone showing Azadi Studio services':'Interactive 3D desktop computer showing Azadi Studio services');
            }
            applyDeviceExperience();
            window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(applyDeviceExperience,120)},{passive:true});
            window.addEventListener('orientationchange',()=>setTimeout(applyDeviceExperience,120),{passive:true});
          })();
          '''

          if js_marker not in text:
              idx = text.rfind('</script>')
              if idx == -1:
                  raise SystemExit('Could not find closing script tag')
              text = text[:idx] + js + '\n' + text[idx:]

          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add adaptive mobile iPhone and desktop workstation experience'
          git push
